# ── BINventory — docker-compose.yml ──────────────────────────────────────────
#   Start:   docker compose up -d
#   Stop:    docker compose down          (data is kept)
#   Logs:    docker compose logs -f
#   Update:  docker compose up -d --build
#
# Settings come from .env (copy .env.example). Defaults work without one.

services:
  binventory:
    build:
      context: .
      dockerfile: Dockerfile
    image: binventory:latest
    container_name: binventory
    restart: unless-stopped
    init: true                       # forwards SIGTERM so `docker compose down` is instant

    ports:
      - "${HOST_PORT:-5000}:5000"
      # AI Assistant (MCP) plugin, when enabled in Settings -> Plugins. Published
      # on the host's 127.0.0.1 only, so only programs on this machine can reach
      # it. For other devices, also turn on "Allow other devices" in the plugin
      # (token + HTTPS) and change this to "${MCP_PORT:-5050}:5050".
      - "127.0.0.1:${MCP_PORT:-5050}:5050"

    volumes:
      # Named volumes survive restarts AND rebuilds; only `down -v` deletes them.
      #   binventory_uploads -> item photos
      #   binventory_data    -> SQLite DB, TLS certificate, CLIP + EasyOCR weights,
      #                         label-embedding cache, backups, quarantined photos
      - binventory_uploads:/app/static/uploads
      - binventory_data:/app/data

      # Tag dictionaries, bind-mounted so you can edit the .txt files on the
      # host and apply them with Settings -> Dictionaries -> Reload from disk.
      # The app also writes here (Vocabulary Review -> Add to Dictionary), so on
      # Linux the folder must be writable by UID 1000 — see the README.
      - ./dictionaries:/app/dictionaries

    environment:
      # Your computer's LAN IP, added to the self-signed certificate so phones
      # don't get a name-mismatch error. The container can't detect it itself.
      - BINVENTORY_CERT_HOSTS=${HOST_LAN_IP:-}
      # Set to 1 to serve plain HTTP (live camera capture then only works on
      # localhost; photo upload still works everywhere).
      - BINVENTORY_HTTP=${BINVENTORY_HTTP:-0}

    # CLIP (~1.4 GB) and EasyOCR (~0.7 GB) can be resident together during a
    # run that uses both. Both unload when idle (Settings -> Model Keep-Alive),
    # so steady-state use is far below this ceiling.
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-4g}
        reservations:
          memory: 512m

volumes:
  binventory_uploads:
  binventory_data:
